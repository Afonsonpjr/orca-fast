<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orca Fast</title><style>:root{--bg:#14151d;--panel:#1c1e29;--line:#33364a;--txt:#e7e8ee;--muted:#9aa0b4;--brand:#7c3aed;--client:#2563eb;--product:#16a34a;--promo:#f59e0b}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--txt);font-family:Arial,sans-serif}#bar{height:58px;display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}h1{font-size:16px;margin:0 10px 0 0}.b{border:1px solid var(--line);background:#252837;color:var(--txt);border-radius:8px;padding:8px 11px;cursor:pointer}.b:hover{filter:brightness(1.16)}.b.p{background:var(--brand);border-color:var(--brand)}.b.c{border-color:var(--client);color:#7db0ff}.b.r{border-color:var(--product);color:#76df9a}.b.o{border-color:var(--promo);color:#ffd166}.space{flex:1}#board{position:relative;height:calc(100vh - 58px);overflow:auto;background-image:radial-gradient(#303244 1px,transparent 1px);background-size:22px 22px}#stage,#links{position:absolute;width:2400px;height:1500px;inset:0}#links{pointer-events:none}.node{position:absolute;width:258px;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:0 8px 20px #0007}.head{cursor:grab;padding:9px 10px;border-radius:10px 10px 0 0;font-weight:bold;font-size:13px;display:flex;justify-content:space-between}.cliente .head{background:var(--client)}.produto .head{background:var(--product)}.promocao .head{background:var(--promo);color:#24242b}.total .head{background:var(--brand)}.x{cursor:pointer}.body{padding:10px;display:grid;gap:7px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.field input,.field select{width:100%;padding:6px;border-radius:6px;border:1px solid var(--line);background:#252837;color:var(--txt)}.cols{display:flex;gap:7px}.cols .field{flex:1}.port{position:absolute;width:14px;height:14px;border:2px solid #a6abc8;border-radius:50%;background:#34384d;cursor:crosshair}.out{right:-8px;top:50%}.in{left:-8px;top:22px}.promoIn{left:50%;bottom:-8px;transform:translateX(-50%)}.cliente .out{border-color:var(--client)}.produto .out{border-color:var(--product)}.promocao .out{border-color:var(--promo)}.active{background:#fff}.edge{fill:none;stroke-width:3}.del{pointer-events:auto;fill:#dc2626;cursor:pointer}.summary{max-height:135px;overflow:auto;font-size:12px;padding:7px;border:1px solid var(--line);border-radius:6px;background:#252837}.item{padding:4px 0;border-bottom:1px dashed var(--line)}.sum{display:flex;justify-content:space-between;font-size:13px}.sum b{color:#fff}textarea{width:100%;height:128px;background:#252837;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px;font-size:12px;resize:vertical}.actions{display:flex;gap:6px}.actions .b{flex:1;padding:7px;font-size:11px}</style></head><body><div id="bar"><h1>🎨 Orca Fast</h1><button class="b c" onclick="add('cliente')">+ Cliente</button><button class="b r" onclick="add('produto')">+ Produto</button><button class="b o" onclick="add('promocao')">+ Promoç¡¡o</button><button class="b p" onclick="add('total')">+ Total</button><span class="space"></span><button class="b" onclick="save()">💾 Salvar</button><button class="b" onclick="load()">📂 Carregar</button><button class="b" onclick="clearAll()">🗑️ Limpar</button></div><div id="board"><svg id="links"></svg><div id="stage"></div></div><script>let N={},E=[],k=1,wire=null;const S=document.querySelector('#stage'),B=document.querySelector('#board'),V=document.querySelector('#links'),D={cliente:{nome:'',telefone:'',vendedor:'Afonso'},produto:{nome:'',volume:'',preco:'',promo:'',rendimento:'',qtd:1},promocao:{nome:'Promoç¡¡o',desconto:10},total:{}};const id=p=>p+(k++),money=v=>'R$ '+(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2});function f(n,key,label,type='text'){return `<div class="field"><label>${label}</label><input type="${type}" value="${n.d[key]??''}" oninput="edit('${n.id}','${key}',this.value)"></div>`}function add(t,x,y,d){let i=id(t[0]),n={id:i,t,x:x??70+Object.keys(N).length*28,y:y??70+Object.keys(N).length*22,d:{...D[t],...d}};N[i]=n;render(n);calc();return i}function render(n){let e=document.createElement('div');e.id=n.id;e.className='node '+n.t;e.style.left=n.x+'px';e.style.top=n.y+'px';let title='',body='',ports='';if(n.t==='cliente'){title='👤 Cliente';body=f(n,'nome','Nome')+f(n,'telefone','WhatsApp')+f(n,'vendedor','Consultor');ports=`<i class="port out" data-p="out"></i>`}if(n.t==='produto'){title='🧴 Produto';body=f(n,'nome','Produto')+`<div class="cols">${f(n,'volume','Volume')}${f(n,'qtd','Quantidade','number')}</div>`+`<div class="cols">${f(n,'preco','Preç¡¡o original','number')}${f(n,'promo','Preç¡¡o promoç¡¡o','number')}</div>`+f(n,'rendimento','Rendimento por unidade (mÂ²)','number');ports=`<i class="port out" data-p="out"></i><i class="port promoIn" data-p="promo"></i>`}if(n.t==='promocao'){title='🏷️ Promoç¡¡o';body=f(n,'nome','Nome')+f(n,'desconto','Desconto (%)','number');ports=`<i class="port out" data-p="out"></i>`}if(n.t==='total'){title='💰 Orç¡¡amento';body=`<div class="summary" id="l-${n.id}">Conecte produtos.</div><div class="sum"><span>Total:</span><b id="v-${n.id}">R$ 0,00</b></div><div class="sum"><span>Rendimento:</span><b id="r-${n.id}">0 mÂ²</b></div><textarea id="m-${n.id}" readonly></textarea><div class="actions"><button class="b" onclick="copy('${n.id}')">Copiar</button><button class="b p" onclick="wa('${n.id}')">WhatsApp</button><button class="b" onclick="printQ('${n.id}')">Imprimir</button></div>`;ports=`<i class="port in" data-p="in"></i>`}e.innerHTML=`<div class="head"><span>${title}</span><span class="x" onclick="removeN('${n.id}')">✕</span></div><div class="body">${body}</div>${ports}`;S.append(e);drag(e,n);e.querySelectorAll('.port').forEach(p=>p.onclick=q=>{q.stopPropagation();connect(n.id,p.dataset.p,p)});}function edit(i,key,v){N[i].d[key]=v;let e=E.find(e=>e.to.i===i&&e.to.p==='promo');if(e&&key==='preco')promo(i,e.from.i);calc()}function drag(e,n){let a,h=e.querySelector('.head');h.onmousedown=q=>{a=1;let ox=q.clientX-n.x,oy=q.clientY-n.y;document.onmousemove=z=>{if(!a)return;n.x=z.clientX-ox+B.scrollLeft;n.y=z.clientY-oy;e.style.left=n.x+'px';e.style.top=n.y+'px';draw()};document.onmouseup=()=>{a=0;document.onmousemove=null}}}function connect(i,p,el){let n=N[i];if(!wire){if(p!=='out')return;wire={i,t:n.t};el.classList.add('active');return}if(p==='out')return;let ok=((wire.t==='cliente'||wire.t==='produto')&&n.t==='total'&&p==='in')||(wire.t==='promocao'&&n.t==='produto'&&p==='promo');if(ok){if(p==='promo')E=E.filter(e=>!(e.to.i===i&&e.to.p==='promo'));E.push({i:id('e'),from:{i:wire.i,t:wire.t},to:{i,p}});if(wire.t==='promocao')promo(i,wire.i)}document.querySelectorAll('.active').forEach(x=>x.classList.remove('active'));wire=null;draw();calc()}function promo(pi,ri){let p=N[pi],r=N[ri],v=(+(p.d.preco||0)*(1-(+r.d.desconto||0)/100)).toFixed(2);p.d.promo=v;let e=document.querySelector('#'+pi+' input:nth-of-type(4)');if(e)e.value=v}function removeN(i){document.querySelector('#'+i).remove();delete N[i];E=E.filter(e=>e.from.i!==i&&e.to.i!==i);draw();calc()}function point(i,p){let e=document.querySelector('#'+i+' [data-p="'+p+'"]');if(!e)return;let a=e.getBoundingClientRect(),b=B.getBoundingClientRect();return{x:a.left+a.width/2-b.left+B.scrollLeft,y:a.top+a.height/2-b.top+B.scrollTop}}function draw(){V.innerHTML='';E.forEach(e=>{let a=point(e.from.i,'out'),b=point(e.to.i,e.to.p);if(!a||!b)return;let d=Math.max(60,Math.abs(b.x-a.x)/2),p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${a.x},${a.y} C${a.x+d},${a.y} ${b.x-d},${b.y} ${b.x},${b.y}`);p.setAttribute('class','edge');p.setAttribute('stroke',e.from.t==='cliente'?'#2563eb':e.from.t==='produto'?'#16a34a':'#f59e0b');V.append(p)})}function calc(){Object.values(N).filter(n=>n.t==='total').forEach(t=>{let inE=E.filter(e=>e.to.i===t.id),cc=inE.find(e=>N[e.from.i]?.t==='cliente'),c=cc?N[cc.from.i].d:D.cliente,ps=inE.filter(e=>N[e.from.i]?.t==='produto');let T=0,R=0,h='',m='';ps.forEach(e=>{let p=N[e.from.i].d,q=+p.qtd||1,v=p.promo!==''?+p.promo:+p.preco||0,r=+p.rendimento||0,s=v*q,rt=r*q,name=(p.nome||'Produto')+(p.volume?' ('+p.volume+')':'');T+=s;R+=rt;h+=`<div class="item"><b>${name}</b> x${q}: <b>${money(s)}</b></div>`;m+=`📦 ${name} — Qtd: ${q}\nPreç¡¡o: ${money(v)} por unidade\nRendimento: atÃ© ${r} mÂ²/un\nSubtotal: ${money(s)}\n\n`});document.querySelector('#l-'+t.id).innerHTML=h||'Conecte produtos.';document.querySelector('#v-'+t.id).textContent=money(T);document.querySelector('#r-'+t.id).textContent=R+' mÂ²';let txt=`OlÃ¡, ${c.nome||'[cliente]'}, tudo bem?\n\nAqui Ã o ${c.vendedor||'Afonso'}, consultor da loja de tintas e decoraç¡¡o. Segue o orç¡¡amento personalizado:\n\n${m}💰 Total do orç¡¡amento: ${money(T)}\n📐 Rendimento total estimado: atÃ© ${R} mÂ²\n\nQualquer dÃºvida, estou Ã  disposiç¡¡o! 😊`;document.querySelector('#m-'+t.id).value=txt;t.msg=txt;t.tel=c.telefone})}function copy(i){navigator.clipboard.writeText(N[i].msg)}function wa(i){let n=N[i],t=(n.tel||'').replace(/\D/g,'');open((t?'https://wa.me/'+t:'https://wa.me/')+'?text='+encodeURIComponent(n.msg),'_blank')}function printQ(i){let w=open('','_blank');w.document.write('<pre>'+N[i].msg+'</pre>');w.print()}function save(){localStorage.orcaN=JSON.stringify(N);localStorage.orcaE=JSON.stringify(E);localStorage.orcaK=k}function load(){if(!localStorage.orcaN)return;clearAll();N=JSON.parse(localStorage.orcaN);E=JSON.parse(localStorage.orcaE);k=+localStorage.orcaK;Object.values(N).forEach(render);draw();calc()}function clearAll(){S.innerHTML='';V.innerHTML='';N={};E=[]}B.onscroll=draw;onresize=draw;let c=add('cliente',40,40),a=add('produto',370,45,{nome:'Tinta / Revestimento',volume:'18 L',preco:899.99,promo:799.99,rendimento:80}),b=add('produto',370,330,{nome:'Tinta / Revestimento',volume:'3,6 L',preco:229.99,promo:199.99,rendimento:18}),t=add('total',730,110);E.push({i:id('e'),from:{i:c,t:'cliente'},to:{i:t,p:'in'}},{i:id('e'),from:{i:a,t:'produto'},to:{i:t,p:'in'}},{i:id('e'),from:{i:b,t:'produto'},to:{i:t,p:'in'}});draw();calc();</script></body></html>
